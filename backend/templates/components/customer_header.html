<!-- Customer Top Application Header -->
<header class="app-header">
    <div class="header-left">
        <h1 class="page-title">{{ page_title | default('Customer Portal') }}</h1>
        <div class="breadcrumb">Smart Inventory / {{ page_breadcrumb | default('Product Catalog') }}</div>
    </div>

    <div class="header-right">
        <form action="{{ url_for('web.customer_dashboard') }}" method="GET" class="global-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" name="search" value="{{ search_query | default('') }}" placeholder="Search products or SKU...">
        </form>

        <form action="{{ url_for('web.toggle_theme') }}" method="POST" style="margin:0;">
            <input type="hidden" name="redirect_url" value="{{ request.full_path }}">
            {% if session.get('theme', 'dark') == 'light' %}
            <button type="submit" class="theme-toggle-btn btn-header-action" title="Switch to dark mode" aria-label="Switch to dark mode">
                <i class="fa-solid fa-moon"></i>
            </button>
            {% else %}
            <button type="submit" class="theme-toggle-btn btn-header-action" title="Switch to light mode" aria-label="Switch to light mode">
                <i class="fa-solid fa-sun"></i>
            </button>
            {% endif %}
        </form>

        <a href="{{ request.full_path }}" class="btn-header-action" title="Refresh Product Catalog">
            <i class="fa-solid fa-rotate-right"></i> Refresh
        </a>
    </div>
</header>
