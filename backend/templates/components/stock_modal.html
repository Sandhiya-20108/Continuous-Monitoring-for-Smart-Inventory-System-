{% if stock_product %}
<!-- STOCK IN / STOCK OUT MODAL (SERVER-SIDE RENDERED) -->
<div class="modal-overlay active">
    <div class="modal-card" style="max-width: 440px;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1rem;">
            <h3 style="font-size: 1.05rem; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fa-solid fa-boxes-stacked" style="color: var(--accent-color);"></i> Stock Movement Adjustment
            </h3>
            <a href="{{ request.path }}" class="drawer-close" title="Close Modal">&times;</a>
        </div>
        
        <div style="background: rgba(255,255,255,0.03); border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; border: 1px solid var(--border-color);">
            <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-main);">{{ stock_product.name }}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 0.25rem;">
                <span>SKU: <code>{{ stock_product.sku }}</code></span>
                <span>Current Stock: <strong style="color: #38bdf8;">{{ stock_product.current_stock }} {{ stock_product.unit | default('Units') }}</strong></span>
            </div>
        </div>

        <form action="{{ url_for('web.update_stock', product_id=stock_product._id) }}" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
            
            <div class="form-group">
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; display: block;">Select Operation Type:</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
                    <label style="display: flex; align-items: center; justify-content: center; gap: 0.3rem; padding: 0.5rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #34d399;">
                        <input type="radio" name="operation" value="STOCK_IN" checked style="accent-color: #10b981;">
                        📥 Stock In
                    </label>
                    <label style="display: flex; align-items: center; justify-content: center; gap: 0.3rem; padding: 0.5rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #f87171;">
                        <input type="radio" name="operation" value="STOCK_OUT" style="accent-color: #ef4444;">
                        📤 Stock Out
                    </label>
                    <label style="display: flex; align-items: center; justify-content: center; gap: 0.3rem; padding: 0.5rem; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #60a5fa;">
                        <input type="radio" name="operation" value="ADJUSTMENT" style="accent-color: #3b82f6;">
                        ⚙️ Direct Set
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; display: block;">Quantity:</label>
                <input type="number" name="quantity" value="1" class="form-control" style="padding-left:1rem; font-size: 1rem; font-weight: 700;" min="1" required>
            </div>

            <div class="form-group">
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; display: block;">Reason / Note (Optional):</label>
                <input type="text" name="notes" class="form-control" placeholder="e.g. Received new shipment batch, damaged goods removal..." style="padding-left:1rem; font-size: 0.85rem;">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
                <a href="{{ request.path }}" class="btn-action" style="padding: 0.5rem 1rem; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-muted); text-decoration: none; border-radius: 6px;">Cancel</a>
                <button type="submit" class="btn-action" style="padding: 0.5rem 1.25rem; background: var(--accent-color, #3b82f6); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;">
                    <i class="fa-solid fa-check"></i> Apply Stock Change
                </button>
            </div>
        </form>
    </div>
</div>
{% endif %}
